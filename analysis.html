<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JHP - 분석</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase 공통 로드 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</head>
<body>

    <div class="view-container active" id="view-analysis-list">
        <!-- 설정이나 분석 HTML의 헤더를 이걸로 교체 -->
<header class="top-nav-bar center-logo">
    <div class="logo font-pinyon">JHP</div>
</header>
        <main class="content-area" style="padding-top:20px;">
            <div class="perf-list-group">
                <span class="perf-badge">등 중/상부</span>
                <div class="perf-list-box">
                    <div class="perf-item" onclick="openPerfDetail('체스트 서포티드 머신 로우')"><div class="perf-thumb"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/Pull_up_animation.gif"></div><span class="perf-name">체스트 서포티드 머신 로우 (레버)</span><span class="perf-arrow">></span></div>
                </div>
            </div>
            <div class="perf-list-group">
                <span class="perf-badge">가슴</span>
                <div class="perf-list-box">
                    <div class="perf-item" onclick="openPerfDetail('해머 스트렝스 체스트 프레스')"><div class="perf-thumb"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d4/Bench_press_animation.gif"></div><span class="perf-name">해머 스트렝스 체스트 프레스 머신</span><span class="perf-arrow">></span></div>
                </div>
            </div>
        </main>
    </div>

    <div class="view-container" id="view-analysis-detail">
        <header class="top-nav-bar"><button class="icon-btn" onclick="closePerfDetail()">←</button><span class="tn-title" id="ad-title">상세 분석</span><div style="width:30px;"></div></header>
        <main class="content-area" style="padding-top:20px;" id="ad-render"></main>
    </div>

    <script src="analysis.js"></script>
</body>
</html>
