<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JHP - 분석</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- [1] 분석 메인 리스트 화면 -->
    <div class="view-container active" id="view-analysis-list" style="display: block;">
        <header class="top-nav-bar center-logo">
            <div class="logo font-pinyon">JHP</div>
        </header>
        
        <main class="content-area" style="padding-top:20px;">
            <div class="perf-list-group">
                <span class="perf-badge">어깨</span>
                <div class="perf-list-box">
                    <div class="perf-item" onclick="openPerfDetail('오버헤드 프레스')">
                        <div class="perf-thumb"><img src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Seated_dumbbell_shoulder_press_animation.gif"></div>
                        <span class="perf-name">오버헤드 프레스</span><span class="perf-arrow">></span>
                    </div>
                    <div class="perf-item" onclick="openPerfDetail('덤벨 레터럴 레이즈')">
                        <div class="perf-thumb"><img src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Seated_dumbbell_shoulder_press_animation.gif"></div>
                        <span class="perf-name">덤벨 레터럴 레이즈</span><span class="perf-arrow">></span>
                    </div>
                </div>
            </div>

            <div class="perf-list-group">
                <span class="perf-badge">팔 (이두 / 삼두)</span>
                <div class="perf-list-box">
                    <div class="perf-item" onclick="openPerfDetail('바벨 바이셉 컬')">
                        <div class="perf-thumb"><img src="https://upload.wikimedia.org/wikipedia/commons/8/80/Biceps_curl_animation.gif"></div>
                        <span class="perf-name">바벨 바이셉 컬</span><span class="perf-arrow">></span>
                    </div>
                    <div class="perf-item" onclick="openPerfDetail('케이블 트라이셉 푸시다운')">
                        <div class="perf-thumb"><img src="https://upload.wikimedia.org/wikipedia/commons/6/63/Pushdown_animation.gif"></div>
                        <span class="perf-name">케이블 트라이셉 푸시다운</span><span class="perf-arrow">></span>
                    </div>
                </div>
            </div>
            
            <div class="perf-list-group">
                <span class="perf-badge">등 중/상부</span>
                <div class="perf-list-box">
                    <div class="perf-item" onclick="openPerfDetail('체스트 서포티드 머신 로우')">
                        <div class="perf-thumb"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/Pull_up_animation.gif"></div>
                        <span class="perf-name">체스트 서포티드 머신 로우 (레버)</span><span class="perf-arrow">></span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- [2] 상세 분석 차트 화면 -->
    <div class="view-container" id="view-analysis-detail" style="display: none;">
        <header class="top-nav-bar">
            <button class="icon-btn" onclick="closePerfDetail()">←</button>
            <span class="tn-title" id="ad-title">상세 분석</span>
            <div style="width:30px;"></div>
        </header>
        <main class="content-area" style="padding-top:20px;" id="ad-render"></main>
    </div>

    <script src="app.js"></script>
    <script src="analysis.js"></script>

</body>
</html>
