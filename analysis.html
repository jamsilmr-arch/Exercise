<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JHP - 분석</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- [1] 분석 메인 리스트 화면 -->
    <div class="view-container active" id="view-analysis-list" style="display: block;">
        <header class="top-nav-bar center-logo">
            <div class="logo font-pinyon">JHP</div>
        </header>
        
        <main class="content-area" style="padding-top:20px;">
            
            <!-- 가슴 그룹 -->
            <div class="perf-list-group">
                <span class="perf-badge">가슴</span>
                <div class="perf-list-box">
                    <div class="perf-item" onclick="openPerfDetail('벤치 프레스')"><span class="perf-name">벤치 프레스</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('인클라인 프레스')"><span class="perf-name">인클라인 프레스</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('펙덱 플라이')"><span class="perf-name">펙덱 플라이</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('딥스')"><span class="perf-name">딥스</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('푸시업')"><span class="perf-name">푸시업</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('풀오버')"><span class="perf-name">풀오버</span><span class="perf-arrow">></span></div>
                </div>
            </div>

            <!-- 등 그룹 -->
            <div class="perf-list-group">
                <span class="perf-badge">등</span>
                <div class="perf-list-box">
                    <div class="perf-item" onclick="openPerfDetail('풀업')"><span class="perf-name">풀업</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('바벨 로우')"><span class="perf-name">바벨 로우</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('랫풀다운')"><span class="perf-name">랫풀다운</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('시티드 로우')"><span class="perf-name">시티드 로우</span><span class="perf-arrow">></span></div>
                </div>
            </div>

            <!-- 하체 그룹 -->
            <div class="perf-list-group">
                <span class="perf-badge">하체</span>
                <div class="perf-list-box">
                    <div class="perf-item" onclick="openPerfDetail('스쿼트')"><span class="perf-name">스쿼트</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('루마니안 데드리프트')"><span class="perf-name">루마니안 데드리프트</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('레그 프레스')"><span class="perf-name">레그 프레스</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('레그 익스텐션')"><span class="perf-name">레그 익스텐션</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('레그 컬')"><span class="perf-name">레그 컬</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('카프 레이즈')"><span class="perf-name">카프 레이즈</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('이너 타이')"><span class="perf-name">이너 타이</span><span class="perf-arrow">></span></div>
                </div>
            </div>

            <!-- 어깨 그룹 -->
            <div class="perf-list-group">
                <span class="perf-badge">어깨</span>
                <div class="perf-list-box">
                    <div class="perf-item" onclick="openPerfDetail('오버헤드 프레스')"><span class="perf-name">오버헤드 프레스</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('사이드 레터럴 레이즈')"><span class="perf-name">사이드 레터럴 레이즈</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('프론트 레이즈')"><span class="perf-name">프론트 레이즈</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('페이스 풀')"><span class="perf-name">페이스 풀</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('리어 델트')"><span class="perf-name">리어 델트 플라이</span><span class="perf-arrow">></span></div>
                </div>
            </div>

            <!-- 팔 그룹 -->
            <div class="perf-list-group">
                <span class="perf-badge">팔 (이두 / 삼두)</span>
                <div class="perf-list-box">
                    <div class="perf-item" onclick="openPerfDetail('바벨 컬')"><span class="perf-name">바벨 컬</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('해머 컬')"><span class="perf-name">해머 컬</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('삼두 푸시다운')"><span class="perf-name">트라이셉 푸시다운</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('트라이셉 익스텐션')"><span class="perf-name">오버헤드 트라이셉 익스텐션</span><span class="perf-arrow">></span></div>
                </div>
            </div>
            
            <!-- 둔근 그룹 -->
            <div class="perf-list-group">
                <span class="perf-badge">힙 / 둔근</span>
                <div class="perf-list-box">
                    <div class="perf-item" onclick="openPerfDetail('힙 쓰러스트')"><span class="perf-name">힙 쓰러스트</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('런지')"><span class="perf-name">런지</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('힙 어브덕션')"><span class="perf-name">힙 어브덕션</span><span class="perf-arrow">></span></div>
                    <div class="perf-item" onclick="openPerfDetail('킥백')"><span class="perf-name">케이블 킥백</span><span class="perf-arrow">></span></div>
                </div>
            </div>

        </main>
    </div>

    <!-- [2] 상세 분석 차트 화면 -->
    <div class="view-container" id="view-analysis-detail" style="display: none;">
        <header class="top-nav-bar">
            <button class="icon-btn" onclick="closePerfDetail()">←</button>
            <span class="tn-title" id="ad-title">상세 분석</span>
            <div style="width:30px;"></div>
        </header>
        <main class="content-area" style="padding-top:20px;" id="ad-render"></main>
    </div>

    <script src="app.js"></script>
    <script src="analysis.js"></script>

</body>
</html>
