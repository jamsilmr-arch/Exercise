<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>40 Min Overload - 설정</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="view-splash" class="view-container active no-scroll flex-center">
        <div class="splash-netflix-content">
            <p class="splash-sub">헬스 트레이닝 앱</p>
            <h1 class="splash-netflix-logo">JHP</h1>
        </div>
        <div class="splash-netflix-footer">
            <button id="btn-start-onboarding" class="netflix-start-btn">앱 시작하기</button>
        </div>
    </div>

    <div id="view-login" class="view-container flex-center no-scroll" style="padding: 40px;">
        <div class="login-logo font-pinyon">JHP</div>
        <h1 class="login-title">거의 다 왔어요</h1>
        <p class="login-desc">나만의 맞춤 루틴을 계정에 저장할게요</p>
        <div class="login-btns">
            <button class="login-btn google" id="btn-login-google"><span class="btn-icon">G</span> Google로 시작하기</button>
            <button class="login-btn-skip" id="btn-skip-login">로그인 없이 이용하기</button>
        </div>
    </div>

    <div id="view-settings" class="view-container">
        <header class="wizard-header">
            <div class="wizard-top">
                <span class="wizard-title" style="text-align: right; width: 100%;">맞춤형 루틴을 생성해요</span>
            </div>
            <div class="progress-container">
                <div class="progress-text"><span id="step-counter">질문 1/12</span></div>
                <div class="progress-bar-bg"><div id="wizard-progress" class="progress-bar-fill" style="width: 8.3%;"></div></div>
            </div>
        </header>
        <main class="wizard-content">
            <h1 id="q-title" class="q-title"></h1>
            <p id="q-desc" class="q-desc"></p>
            <div id="wizard-input-area"></div>
        </main>
        <div class="wizard-footer">
            <div class="hint-box"><span>💡</span><span id="q-hint"></span></div>
            <div class="wizard-footer-btns">
                <button id="btn-prev-step" class="btn-prev">이전</button>
                <button id="btn-next-step" class="btn-next">다음</button>
            </div>
        </div>
    </div>

    <div id="view-loading" class="view-container flex-center no-scroll">
        <div class="loader-circle"></div>
        <h2 class="loading-title">맞춤형 루틴을<br>생성하고 있어요</h2>
        <p class="loading-desc">잠시만 기다려주세요.<br>곧 최적의 루틴 구조를 보여드릴게요.</p>
    </div>

    <div id="view-result-explain" class="view-container">
        <header class="result-header">
            <div class="r-top">추천 루틴</div>
            <h1 class="r-title">질문을 기반으로<br>맞춤 루틴을 만들고 있어요</h1>
            <div class="r-progress-container" id="explain-progress-bar"></div>
        </header>
        <main class="result-timeline" id="explain-timeline"></main>
        <div class="result-bottom-card" id="explain-bottom-card">
            <div class="r-desc-text" id="explain-desc"></div>
            <button class="r-tap-btn" id="explain-tap-text">탭하여 계속 ></button>
        </div>
    </div>

    <div id="view-recommended-routine" class="view-container">
        <header class="rec-header">
            <div class="r-top-nav"><button class="icon-btn" id="btn-rec-back">←</button><span class="r-nav-title">추천 루틴</span></div>
            <div class="r-badge">✓ 루틴 구성 완료</div>
            <h1 class="r-main-title">사용자님을 위한<br>루틴 구조예요</h1>
            <h2 class="r-sub-title" id="rec-subtitle">주 3회 (밀기-당기기-하체) 루틴</h2>
            <div class="r-chips">
                <span class="r-chip" id="rec-chip-split">밀기-당기기-하체</span>
                <span class="r-chip" id="rec-chip-gender">남성</span>
            </div>
            <div class="r-preview-text">루틴 미리보기 (1주 기준)</div>
        </header>
        <main class="rec-timeline-area" id="rec-timeline-render"></main>
        <div class="rec-footer">
            <div class="scroll-down-hint">스크롤해서 루틴 확인하기 ↓</div>
            <button id="btn-go-home" class="primary-btn">루틴 시작하기</button>
        </div>
    </div>

    <script src="onboarding.js"></script>
</body>
</html>
