<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>40 Min Overload</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- [화면 1] 홈 대시보드 (레퍼런스 이미지 UI 반영) -->
    <div id="view-home" class="view-container active">
        <header class="top-nav">
            <div class="logo">40MIN</div>
            <button class="tutorial-btn">튜토리얼 보기</button>
        </header>

        <main class="content-area">
            <h2 class="routine-title">직장인 점심 3분할 루틴</h2>
            <div class="target-bar-container">
                <div class="target-bar"></div>
                <span class="target-text">목표: 린매스업 (체지방 14% 컷)</span>
            </div>

            <!-- 메인 운동 카드 -->
            <div class="main-card">
                <div class="card-badge">오늘 운동</div> <span class="card-day">Day 1 (밀기)</span>
                <div class="card-stats">
                    <div class="stat-item">
                        <span class="stat-icon">💪</span>
                        <span class="stat-value">4개 종목</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-icon">📊</span>
                        <span class="stat-value">14세트 (40분)</span>
                    </div>
                </div>
                <button id="btn-start-workout" class="primary-btn">오늘 운동 시작</button>
            </div>

            <!-- 완료율 -->
            <div class="progress-section">
                <h3>이번 주 완료율</h3>
                <div class="progress-track"><div class="progress-fill" style="width: 0%;"></div></div>
                <span class="progress-percent">0%</span>
            </div>

            <!-- 주차 블록 -->
            <div class="weekly-block">
                <h3>1주차 진행 상황</h3>
                <div class="week-grid">
                    <div class="day-box active">Day<br>1</div>
                    <div class="day-box">Day<br>2</div>
                    <div class="day-box">Day<br>3</div>
                    <div class="day-box rest">유산소</div>
                    <div class="day-box rest">휴식</div>
                </div>
            </div>
        </main>
    </div>

    <!-- [화면 2] 실제 운동 훈련 타이머 화면 -->
    <div id="view-workout" class="view-container">
        <header class="workout-header">
            <button id="btn-back" class="icon-btn">←</button>
            <h1>Day 1: 밀기 데이</h1>
            <div id="global-timer">00:00</div>
        </header>
        <main id="exercise-list" class="content-area">
            <!-- app.js에서 종목 리스트가 렌더링됩니다 -->
        </main>
    </div>

    <!-- 하단 네비게이션 바 -->
    <nav class="bottom-nav">
        <div class="nav-item active"><span class="nav-icon">🏠</span><span class="nav-text">홈</span></div>
        <div class="nav-item"><span class="nav-icon">📋</span><span class="nav-text">루틴</span></div>
        <div class="nav-item"><span class="nav-icon">📈</span><span class="nav-text">분석</span></div>
        <div class="nav-item"><span class="nav-icon">⚙️</span><span class="nav-text">설정</span></div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
