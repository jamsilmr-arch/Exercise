<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>40 Min Overload</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- [화면 1] 홈 대시보드 -->
    <div id="view-home" class="view-container active">
        <header class="top-nav">
            <div class="logo">40MIN</div>
            <button class="tutorial-btn">루틴 수정</button>
        </header>
        <main class="content-area">
            <h2 class="routine-title">직장인 점심 3분할 루틴</h2>
            <div class="target-bar-container">
                <div class="target-bar"></div>
                <span class="target-text">목표: 린매스업 (체지방 14% 컷)</span>
            </div>
            <div class="main-card">
                <div class="card-badge">오늘 운동</div> <span class="card-day">Day 1 (밀기)</span>
                <div class="card-stats">
                    <div class="stat-item"><span class="stat-icon">💪</span><span class="stat-value">4개 종목</span></div>
                    <div class="stat-item"><span class="stat-icon">📊</span><span class="stat-value">14세트 (40분)</span></div>
                </div>
                <button id="btn-start-workout" class="primary-btn">오늘 운동 시작</button>
            </div>
        </main>
    </div>

    <!-- [화면 2] 실제 훈련 타이머 화면 -->
    <div id="view-workout" class="view-container">
        <header class="workout-header">
            <button id="btn-back" class="icon-btn">←</button>
            <h1>Day 1: 밀기 데이</h1>
            <div id="global-timer">00:00</div>
        </header>
        <main id="exercise-list" class="content-area"></main>
    </div>

    <!-- [화면 3] 분석 (알고리즘) -->
    <div id="view-analysis" class="view-container">
        <!-- 기존 분석 화면 내용 동일 유지 (생략) -->
        <header class="algo-header">
            <h1 class="algo-title">최신 연구를 모두 분석해<br><span class="highlight">알고리즘으로 구현</span>했습니다.</h1>
        </header>
        <main class="algo-content">
            <div class="metric-grid">
                <div class="metric-card"><span class="m-label">중량</span><span class="m-value highlight">45</span><span class="m-unit">KG</span></div>
                <div class="metric-card"><span class="m-label">횟수</span><span class="m-value highlight">12</span><span class="m-unit">REPS</span></div>
                <div class="metric-card"><span class="m-label">세트</span><span class="m-value highlight">4</span><span class="m-unit">SETS</span></div>
                <div class="metric-card"><span class="m-label">강도</span><span class="m-value highlight">2</span><span class="m-unit">RIR</span></div>
            </div>
        </main>
    </div>

    <!-- [화면 4] 설정 (맞춤형 루틴 온보딩 마법사) -->
    <div id="view-settings" class="view-container">
        <header class="wizard-header">
            <div class="wizard-top">
                <button class="icon-btn">←</button>
                <span class="wizard-title">맞춤형 루틴을 생성해요</span>
            </div>
            <div class="progress-container">
                <div class="progress-text">
                    <span id="step-counter">질문 1/5</span>
                    <span>맞춤 루틴 추천 준비</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="wizard-progress" class="progress-bar-fill" style="width: 20%;"></div>
                </div>
            </div>
        </header>

        <main class="wizard-content">
            <h1 id="q-title" class="q-title">체중을 알려주세요</h1>
            <p id="q-desc" class="q-desc">정확한 중량 추천을 위해 필요해요</p>

            <!-- 동적 입력 영역 -->
            <div id="wizard-input-area"></div>

            <div class="hint-box">
                <span>💡</span>
                <span id="q-hint">체중은 알고리즘이 권장 중량을 계산할 때 사용돼요.</span>
            </div>
        </main>

        <div class="wizard-footer">
            <button id="btn-prev-step" class="btn-prev">이전</button>
            <button id="btn-next-step" class="btn-next">다음</button>
        </div>
    </div>

    <!-- 하단 네비게이션 바 -->
    <nav class="bottom-nav">
        <div class="nav-item active" data-target="view-home"><span class="nav-icon">🏠</span><span class="nav-text">홈</span></div>
        <div class="nav-item"><span class="nav-icon">📋</span><span class="nav-text">루틴</span></div>
        <div class="nav-item" data-target="view-analysis"><span class="nav-icon">📊</span><span class="nav-text">분석</span></div>
        <div class="nav-item" data-target="view-settings"><span class="nav-icon">⚙️</span><span class="nav-text">설정</span></div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
