<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JHP - 홈</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- 메인 홈 대시보드 -->
    <div class="view-container active">
        <header class="home-header">
            <div class="top-logo-area"><div class="logo font-pinyon">JHP</div></div>
            <h1 class="routine-main-title" id="home-routine-title">주 6회 (몸통-말단-하체) 루틴</h1>
            <div class="target-split-bar">
                <div class="split-blocks"><div class="s-block cyan"></div><div class="s-block"></div><div class="s-block"></div><div class="s-block"></div><div class="s-block light"></div></div>
                <span class="target-split-text" id="home-ratio-text">스트렝스 25 : 근비대 75</span>
            </div>
        </header>
        <main class="content-area">
            <div class="today-workout-card">
                <div class="tw-top"><span class="tw-badge">오늘 운동</span><span class="tw-title" id="home-today-day">Day 1</span></div>
                <div class="tw-stats">
                    <div class="tw-stat-box"><span class="tw-stat-icon">💪</span><span class="tw-stat-text" id="home-today-count">6개 운동</span></div>
                    <div class="tw-stat-box"><span class="tw-stat-icon">🏋️</span><span class="tw-stat-text" id="home-today-sets">18세트</span></div>
                </div>
                <!-- 훈련 화면 진입은 일단 별도 분리하지 않고 루틴 탭에서 하거나 보류 (현재 파일에선 링크 임시처리) -->
                <button class="primary-btn" onclick="alert('훈련 기능은 기능 최적화 중입니다.');">오늘 운동 시작</button>
            </div>
            
            <div class="data-progress-section">
                <div class="dp-title">맞춤 코칭을 위한 데이터 분석 중.</div>
                <div class="dp-bar-bg"><div class="dp-bar-fill" style="width:14%"></div><span class="dp-text">14%</span></div>
            </div>
            <div class="week-blocks-section">
                <div class="wb-title">1주차 <span style="font-size:0.75rem;">5주 운동 · 1주 디로딩</span></div>
                <div class="wb-scroll-area" id="home-week-blocks"></div>
            </div>
        </main>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="location.href='home.html'"><span class="nav-icon">🏠</span><span class="nav-text">홈</span></div>
        <div class="nav-item" onclick="location.href='routine.html'"><span class="nav-icon">📋</span><span class="nav-text">루틴</span></div>
        <div class="nav-item" onclick="location.href='analysis.html'"><span class="nav-icon">📊</span><span class="nav-text">분석</span></div>
        <div class="nav-item" onclick="location.href='settings.html'"><span class="nav-icon">⚙️</span><span class="nav-text">설정</span></div>
    </nav>

    <script src="home.js"></script>
</body>
</html>
