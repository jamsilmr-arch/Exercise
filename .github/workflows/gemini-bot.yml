name: Gemini Bot Auto Commit & Push

on:
  workflow_dispatch: # Actions 탭에서 수동으로 실행 트리거
  # push:
  #   branches: [ main ] # 필요 시 특정 브랜치 푸시 때 자동 실행

permissions:
  contents: write # GITHUB_TOKEN에 저장소 쓰기/푸시 권한 부여

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # [1] 저장소 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # [2] Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # [3] 의존성 라이브러리 설치 및 Gemini 스크립트 실행
      - name: Run Gemini Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pip install --upgrade pip
          pip install google-genai
          python -c "print('Gemini task completed')" 

      # [4] GITHUB_TOKEN을 활용한 변경사항 자동 커밋 & 푸시
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "feat: auto update via Gemini Bot"
            git push origin main
          else
            echo "No changes to commit."
          fi
