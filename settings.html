<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JHP - 설정</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- 설정 메인 화면 -->
    <div class="view-container active" id="view-settings" style="display:block;">
        <header class="top-nav-bar center-logo">
            <div class="logo font-pinyon">JHP</div>
        </header>
        
        <div class="profile-section">
            <div class="profile-name" id="set-profile-name">사용자 님</div>
            <div class="profile-email" id="set-profile-email"></div>
        </div>
        
        <div class="settings-list">
            <div class="st-card">
                <div class="st-item" onclick="openBottomSheet('info')">
                    <div class="st-left">나의 정보</div><div class="st-right"><span class="st-arrow">></span></div>
                </div>
                <div class="st-item" onclick="if(typeof startCardioWizard === 'function') startCardioWizard();">
                    <div class="st-left">유산소</div><div class="st-right">설정하기 <span class="st-arrow">></span></div>
                </div>
            </div>
            
            <div class="st-card">
                <div class="st-item" style="cursor:default;" onclick="document.getElementById('toggle-rest').classList.toggle('active');">
                    <div class="st-left">휴식 완료 알림<span class="st-desc">세트 사이 휴식이 끝나면 알려드려요</span></div>
                    <div class="st-right"><div class="st-toggle active" id="toggle-rest"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 공통 로직이 담긴 app.js 호출 -->
    <script src="app.js"></script>
    <script src="settings.js"></script>
</body>
</html>
