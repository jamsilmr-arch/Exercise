<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JHP - 루틴</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</head>
<body>

    <div class="view-container active" id="view-list">
        <header class="top-nav-bar">
            <div class="logo font-pinyon">JHP</div>
            <div class="icon-btn" style="font-size:1rem; border:1px solid #555; padding:4px 8px; border-radius:50%; color:#aaa;">i</div>
        </header>
        <div class="rt-notice">ⓘ 주 3일(!)로 루틴을 수정하세요</div>
        
        <div class="rt-section-title">내 루틴</div>
        <div class="rt-card" style="border-color:var(--primary);" onclick="openDetail('rt_6_body_limb_lower')">
            <div class="rt-c-top"><span class="rt-c-badge">사용중</span><span class="rt-c-title">주 6회 (몸통-말단-하체) 루틴</span><span style="margin-left:auto;">⋮</span></div>
            <div class="rt-c-chips"><span class="rt-chip">몸통-말단-하체</span><span class="rt-chip">남성</span></div>
        </div>

        <div class="rt-section-title" style="margin-top:10px;">루틴 선택</div>
        <div class="rt-filters"><div class="rt-filter active">운동횟수</div><div class="rt-filter">특수루틴</div></div>
        
        <div class="content-area" style="padding-top:0;">
            <div class="rt-card" onclick="openDetail('rt_2_full')"><div class="rt-c-title" style="margin-bottom:10px;">주 2회 무분할 루틴</div><div class="rt-c-chips"><span class="rt-chip">남성</span></div></div>
            <div class="rt-card" onclick="openDetail('rt_3_hybrid')"><div class="rt-c-title" style="margin-bottom:10px;">주 3회 (상체-하체-전신) 루틴</div><div class="rt-c-chips"><span class="rt-chip">상체-하체-전신</span><span class="rt-chip">남성</span></div></div>
            <div class="rt-card" onclick="openDetail('rt_4_split')"><div class="rt-c-title" style="margin-bottom:10px;">주 4회 (상체-하체-상체-하체) 루틴</div><div class="rt-c-chips"><span class="rt-chip">상체-하체-상체-하체</span><span class="rt-chip">남성</span></div></div>
        </div>
    </div>

    <!-- 상세 프리뷰 오버레이 -->
    <div class="view-container" id="view-detail">
        <header class="top-nav-bar"><button class="icon-btn" onclick="closeDetail()">←</button><span class="tn-title">루틴 선택</span><div style="width:30px;"></div></header>
        <div id="rd-render-area"></div>
    </div>

    <script src="routine.js"></script>
</body>
</html>
