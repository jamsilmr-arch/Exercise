<!-- 상단 탭 (특수루틴 삭제됨) -->
<div class="routine-tabs" id="routineTabs">
    <button class="tab-btn active">운동횟수</button>
</div>

<!-- 루틴 리스트 -->
<div class="routine-list" id="routineList">
    <!-- 카드 전체 영역에 onclick 추가 -->
    <div class="routine-card" onclick="openRoutineDetail('주 2회 무분할 루틴')">
        <div class="routine-title">주 2회 무분할 루틴</div>
        <div class="routine-tags">
            <span class="tag">남성</span>
        </div>
    </div>

    <div class="routine-card" onclick="openRoutineDetail('주 3회 (상체-하체-전신) 루틴')">
        <div class="routine-title">주 3회 (상체-하체-전신) 루틴</div>
        <div class="routine-tags">
            <span class="tag">상체-하체-전신</span>
            <span class="tag">남성</span>
        </div>
    </div>
    
    <!-- 필요한 다른 루틴 카드들도 동일하게 onclick="openRoutineDetail('루틴이름')" 을 추가해주세요 -->
</div>

<!-- 세부 루틴 화면 (기본 상태는 숨김) -->
<div id="routineDetailView" style="display: none; padding-top: 20px;">
    <!-- 뒤로가기 버튼 및 타이틀 -->
    <div style="display: flex; align-items: center; margin-bottom: 20px;">
        <button onclick="closeRoutineDetail()" style="background:none; border:none; color:white; font-size: 20px; cursor:pointer; margin-right: 15px;">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h2 id="detailTitle" style="margin: 0; font-size: 20px;">세부 루틴</h2>
    </div>

    <!-- 세부 루틴 내용 (홈 화면과 유사한 디자인) -->
    <div style="background-color: #1a1a1a; padding: 20px; border-radius: 10px;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
            <span style="background-color: #e50914; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;">오늘 운동</span>
            <span style="font-weight: bold; font-size: 16px;">Day 1</span>
        </div>
        
        <div style="display: flex; justify-content: space-around; text-align: center; margin-bottom: 20px; font-size: 14px;">
            <div>💪<br>6개 운동</div>
            <div>🏋️<br>18세트</div>
        </div>

        <button style="width: 100%; background-color: #e50914; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">
            오늘 운동 시작
        </button>
    </div>
</div>
